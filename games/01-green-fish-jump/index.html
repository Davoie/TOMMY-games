<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐟 绿头鱼跳跳 - TOMMY 游戏厅</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- 顶部信息栏 -->
    <div class="hud">
      <a href="../../index.html" class="btn-back" title="返回大厅">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        大厅
      </a>
      <div class="score-display">
        <span class="score-label">🐚</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="high-score-display">
        <span class="score-label">👑</span>
        <span class="score-value" id="highScore">0</span>
      </div>
    </div>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- 覆盖层：开始提示 -->
    <div class="overlay" id="overlayStart">
      <div class="overlay-content">
        <h2>🐟 绿头鱼跳跳</h2>
        <p>深海里来了好多障碍物！</p>
        <p>帮绿头鱼<b>跳起来</b>躲开它们！</p>
        <div class="control-hints">
          <span class="hint"><kbd>空格键</kbd> 跳跃</span>
          <span class="hint">📱 <b>点击屏幕</b> 跳跃</span>
        </div>
        <button class="btn-play" id="btnStart">开始游戏 🎮</button>
      </div>
    </div>

    <!-- 覆盖层：游戏结束 -->
    <div class="overlay hidden" id="overlayEnd">
      <div class="overlay-content">
        <h2>😭 撞到了！</h2>
        <div class="end-score">
          <p>得分：<span class="final-score" id="finalScore">0</span></p>
          <p>最高分：<span class="final-high" id="finalHigh">0</span></p>
          <p class="new-record hidden" id="newRecord">🎉 新纪录！</p>
        </div>
        <button class="btn-play" id="btnRestart">再来一次 🔄</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
